<!DOCTYPE html>
<!-- Página de erro: sem ela o servidor devolve a home em qualquer endereço,
     e o Google vê o mesmo conteúdo em infinitas URLs. -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada — M. H. Formagini</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        @font-face { font-family: 'Cinzel'; font-weight: 400 900; font-display: swap; src: url('/assets/fonts/cinzel-var.woff2') format('woff2'); }
        @font-face { font-family: 'Pirate Scroll'; font-weight: 400 900; font-display: swap; src: url('/assets/fonts/pirate-scroll.woff2') format('woff2'); }
        * { margin: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center;
               background: #141312; color: #F0EDE6; font-family: 'Cinzel', serif; }
        h1 { font-family: 'Pirate Scroll', 'Cinzel', serif; font-size: clamp(2.4rem, 8vw, 5rem); letter-spacing: 6px; margin-bottom: 1rem; }
        p { color: #A6A6A6; letter-spacing: 2px; margin-bottom: 2rem; }
        a { display: inline-block; padding: 0.8rem 2rem; border-radius: 50px; text-decoration: none;
            font-size: 0.75rem; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 600;
            color: #141312; background: linear-gradient(135deg, #E8837A, #D9584B); }
        a:focus-visible { outline: 2px solid #D9584B; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>Caminho perdido</h1>
        <p>Esta página não existe, ou se perdeu na névoa.</p>
        <a href="/">Voltar ao início</a>
    </main>
</body>
</html>
